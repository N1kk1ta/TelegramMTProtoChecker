
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout checker
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3"
          hexpm: latest

      - name: Checkout mtproto_proxy
        uses: actions/checkout@v4
        with:
          repository: seriyps/mtproto_proxy
          path: mtproto_proxy

      - name: Build mtp_ping
        shell: pwsh
        run: |
          Set-Location mtproto_proxy
          rebar3 escriptize
          $mtp = Resolve-Path "_build/default/bin/mtp_ping"
          New-Item -ItemType Directory -Force -Path "../app/bundled" | Out-Null
          Copy-Item $mtp "../app/bundled/mtp_ping"

      - name: Copy Erlang runtime
        shell: pwsh
        run: |
          $erl = (Get-Command erl.exe).Source
          $root = Split-Path (Split-Path $erl -Parent) -Parent
          New-Item -ItemType Directory -Force -Path "app/bundled/erlang" | Out-Null
          robocopy $root "app/bundled/erlang" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          Set-Location app
          pyinstaller --noconsole --onefile --name TelegramProxyChecker --add-data "bundled;bundled" main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "app/dist/TelegramProxyChecker.exe")) { throw "EXE not found" }
          Get-Item "app/dist/TelegramProxyChecker.exe" | Format-List Name,Length,FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramProxyChecker-Windows
          path: app/dist/TelegramProxyChecker.exe
          if-no-files-found: error
