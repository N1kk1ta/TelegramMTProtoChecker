name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout checker
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3"
          hexpm: latest

      - name: Checkout mtproto_proxy
        uses: actions/checkout@v5
        with:
          repository: seriyps/mtproto_proxy
          path: mtproto_proxy

      - name: Build mtp_ping
        shell: pwsh
        run: |
          Set-Location mtproto_proxy
          rebar3 escriptize

          $mtp = Resolve-Path "_build/default/bin/mtp_ping"

          New-Item -ItemType Directory -Force -Path "../app/bundled" | Out-Null

          Copy-Item $mtp "../app/bundled/mtp_ping"

      - name: Copy Erlang runtime
        shell: pwsh
        run: |
          $otpRoot = $env:INSTALL_DIR_FOR_OTP

          if ([string]::IsNullOrWhiteSpace($otpRoot)) {
            throw "INSTALL_DIR_FOR_OTP is not set."
          }

          $erl = Join-Path $otpRoot "bin\erl.exe"

          if (!(Test-Path $erl)) {
            throw "erl.exe not found at $erl"
          }

          Write-Host "Using Erlang OTP from: $otpRoot"

          New-Item -ItemType Directory -Force `
            -Path "app/bundled/erlang" | Out-Null

          robocopy "$otpRoot" "app/bundled/erlang" `
            /E /NFL /NDL /NJH /NJS /NP

          $rc = $LASTEXITCODE

          if ($rc -gt 7) {
            exit $rc
          }

          if (!(Test-Path "app/bundled/erlang/bin/escript.exe")) {
            throw "escript.exe was not copied."
          }

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build single EXE
        shell: pwsh
        run: |
          Set-Location app

          pyinstaller `
            --noconsole `
            --onefile `
            --name TelegramProxyChecker `
            --add-data "bundled;bundled" `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "app/dist/TelegramProxyChecker.exe")) {
            throw "EXE not found"
          }

          Get-Item "app/dist/TelegramProxyChecker.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TelegramProxyChecker-Windows
          path: app/dist/TelegramProxyChecker.exe
