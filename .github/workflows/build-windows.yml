name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout checker
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3"

      - name: Checkout mtproto_proxy
        uses: actions/checkout@v5
        with:
          repository: seriyps/mtproto_proxy
          path: mtproto_proxy

      - name: Build mtp_ping
        shell: pwsh
        run: |
          Set-Location mtproto_proxy
          rebar3 escriptize
          $mtp = Resolve-Path "_build/default/bin/mtp_ping"
          New-Item -ItemType Directory -Force -Path "../app/bundled" | Out-Null
          Copy-Item $mtp "../app/bundled/mtp_ping"
          Write-Host "mtp_ping copied successfully: $mtp"
          exit 0

      - name: Copy Erlang runtime
        shell: pwsh
        run: |
          $otpRoot = $env:INSTALL_DIR_FOR_OTP
          if ([string]::IsNullOrWhiteSpace($otpRoot)) { throw "INSTALL_DIR_FOR_OTP is not set." }

          Write-Host "OTP root: $otpRoot"

          $escript = Get-ChildItem "$otpRoot" -Filter "escript.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $escript) { throw "escript.exe not found below $otpRoot" }

          Write-Host "Found escript: $($escript.FullName)"
          New-Item -ItemType Directory -Force -Path "app/bundled/erlang" | Out-Null

          robocopy "$otpRoot" "app/bundled/erlang" /E /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE
          Write-Host "robocopy exit code: $rc"
          if ($rc -gt 7) { exit $rc }

          # setup-beam's Windows OTP installation may contain erl.ini files
          # with absolute paths from the GitHub runner (D:\a\...).
          # Remove them so the bundled runtime remains relocatable.
          Get-ChildItem "app/bundled/erlang" -Filter "erl.ini" -Recurse -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Write-Host "Removed relocatable-runtime erl.ini files."

          $target = "app/bundled/erlang/bin/escript.exe"
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Force -Path "app/bundled/erlang/bin" | Out-Null
            Copy-Item $escript.FullName $target -Force
          }
          if (!(Test-Path $target)) { throw "Failed to place escript.exe into bundle." }
          Write-Host "Bundled escript: $target"

          exit 0

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          Set-Location app
          pyinstaller --noconsole --onefile --name TelegramProxyChecker --add-data "bundled;bundled" main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item "app/dist/TelegramProxyChecker.exe" -ErrorAction Stop
          Write-Host ("EXE: {0} ({1:N2} MB)" -f $exe.FullName, ($exe.Length / 1MB))

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: TelegramProxyChecker-Windows-v5.13
          path: app/dist/TelegramProxyChecker.exe
          if-no-files-found: error

      - name: Publish GitHub Release v5.13
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v5.13"
          $title = "Telegram Proxy Checker v5.13"
          $exe = "app/dist/TelegramProxyChecker.exe"

          # If v5.9 already exists, replace it with the freshly built EXE.
          gh release delete $tag --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing release $tag to remove."
          }

          gh release create $tag $exe `
            --repo "${{ github.repository }}" `
            --title $title `
            --notes "Windows EXE built automatically by GitHub Actions from commit ${{ github.sha }}." `
            --target "${{ github.sha }}" `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub Release $tag"
          }

          Write-Host "Release $tag published successfully."
