
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout checker
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3"

      - name: Checkout mtproto_proxy
        uses: actions/checkout@v5
        with:
          repository: seriyps/mtproto_proxy
          path: mtproto_proxy

      - name: Build mtp_ping
        shell: pwsh
        run: |
          Set-Location mtproto_proxy
          rebar3 escriptize
          $mtp = Resolve-Path "_build/default/bin/mtp_ping"
          New-Item -ItemType Directory -Force -Path "../app/bundled" | Out-Null
          Copy-Item $mtp "../app/bundled/mtp_ping"
          Write-Host "mtp_ping copied successfully: $mtp"
          exit 0

      - name: Copy Erlang runtime
        shell: pwsh
        run: |
          $otpRoot = $env:INSTALL_DIR_FOR_OTP
          if ([string]::IsNullOrWhiteSpace($otpRoot)) { throw "INSTALL_DIR_FOR_OTP is not set." }

          Write-Host "OTP root: $otpRoot"
          Get-ChildItem "$otpRoot" -Force | Select-Object Name,FullName

          $escript = Get-ChildItem "$otpRoot" -Filter "escript.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $escript) { throw "escript.exe not found below $otpRoot" }

          Write-Host "Found escript: $($escript.FullName)"
          New-Item -ItemType Directory -Force -Path "app/bundled/erlang" | Out-Null

          robocopy "$otpRoot" "app/bundled/erlang" /E /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE
          Write-Host "robocopy exit code: $rc"
          if ($rc -gt 7) { exit $rc }

          $target = "app/bundled/erlang/bin/escript.exe"
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Force -Path "app/bundled/erlang/bin" | Out-Null
            Copy-Item $escript.FullName $target -Force
          }
          if (!(Test-Path $target)) { throw "Failed to place escript.exe into bundle." }
          Write-Host "Bundled escript: $target"

          # Robocopy returns 1 when files were copied successfully.
          # Force the PowerShell step to finish with success.
          exit 0

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          Set-Location app
          pyinstaller --noconsole --onefile --name TelegramProxyChecker --add-data "bundled;bundled" main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "app/dist/TelegramProxyChecker.exe")) { throw "EXE not found" }
          Get-Item "app/dist/TelegramProxyChecker.exe" | Format-List Name,Length,FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: TelegramProxyChecker-Windows
          path: app/dist/TelegramProxyChecker.exe
          if-no-files-found: error
